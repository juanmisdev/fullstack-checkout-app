schema: spec-driven

context: |
  Stack: NestJS 10 + TypeScript (server/), React 19 + Vite + Redux Toolkit + Tailwind 4 (client/).
  Architecture: Hexagonal (Ports & Adapters) with ROP result types on the backend; SPA checkout flow on the frontend.
  Persistence: Prisma (server). Payment gateway sandbox integration (keys via .env only).
  Testing: Jest (server, ts-jest preset). Vitest pending for client (T9).
  Strict TDD: disabled (no workspace-level test command; per-project runners).

strict_tdd: false

projects:
  - path: server
    stack: NestJS 10 + TypeScript + Prisma
    test_command: "cd server && npx jest --coverage"
    test_framework: Jest 29 (ts-jest preset)
  - path: client
    stack: React 19 + Vite + Redux Toolkit + Tailwind 4
    test_command: "pending (vitest, T9)"
    test_framework: vitest-pending

rules:
  proposal:
    - Include rollback plan for risky changes
    - Respect single-pr delivery strategy; keep proposal slices reviewable (<400 changed lines)
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for payment/checkout flows
    - Document architecture decisions with rationale (hexagonal boundaries, ROP)
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns (hexagonal, ROP)
    tdd: false
    test_command: "cd server && npx jest --coverage"
  verify:
    test_command: "cd server && npx jest --coverage"
    build_command: "cd server && npm run build && cd ../client && npm run build"
    coverage_threshold: 80
  archive:
    - Warn before merging destructive deltas