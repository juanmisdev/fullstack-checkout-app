# Serverless deployment config — Lambda + API Gateway HTTP API, Node.js 20.x.
# Sandbox gateway credentials (NOT production secrets) are passed as plain env vars.
# DATABASE_URL is provided at deploy time via --set-env or an env var in the shell.

service: checkout-api
frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'prod'}
  memorySize: 1024
  timeout: 15
  architecture: arm64
  environment:
    STAGE: ${sls:stage}
    # Gateway base URL and sandbox keys are injected at deploy time (NOT committed
    # to the repo). Pass them via the shell environment when running `serverless deploy`.
    GATEWAY_API_URL: ${env:GATEWAY_API_URL, ''}
    GATEWAY_PUBLIC_KEY: ${env:GATEWAY_PUBLIC_KEY, ''}
    GATEWAY_INTEGRITY_KEY: ${env:GATEWAY_INTEGRITY_KEY, ''}
    GATEWAY_RAW_CARD_TOKENIZATION: 'true'
    PERSISTENCE_DRIVER: prisma
    DATABASE_URL: ${env:DATABASE_URL, ''}
  httpApi:
    cors:
      allowedOrigins:
        - 'https://d30is68sphf1e9.cloudfront.net'
        - 'http://localhost:5173'
        - 'http://localhost:3000'
      allowedMethods:
        - GET
        - POST
      allowedHeaders:
        - Content-Type
    payload: '2.0'

package:
  individually: false
  patterns:
    - '!**'
    - 'dist/**'
    - '!dist/**/*.map'
    - 'node_modules/.prisma/**'
    - 'node_modules/@prisma/client/**'
    - 'node_modules/@vendia/**'
    - 'node_modules/helmet/**'
    - '!node_modules/.cache/**'
    - '!node_modules/.bin/**'
    - '!node_modules/*/node_modules/.bin/**'

functions:
  api:
    handler: dist/lambda.handler
    events:
      - httpApi:
          path: /api/v1/{proxy+}
          method: any
      - httpApi:
          path: /api/v1
          method: any

plugins:
  - serverless-esbuild

custom:
  esbuild:
    bundle: true
    external:
      - '@prisma/client'
      - '.prisma'
      - '@vendia/serverless-express'
      - '@nestjs/common'
      - '@nestjs/core'
      - '@nestjs/platform-express'
      - 'reflect-metadata'
      - 'rxjs'
      - 'class-transformer'
      - 'class-validator'
    exclude:
      - 'src/*'
      - 'prisma/*'
      - 'test/*'
    sourcemap: false
    target: node20
    minify: false